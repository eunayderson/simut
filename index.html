<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F7F9F7">
  <meta name="color-scheme" content="light">
  <meta name="description" content="SIMUT: monitoramento de atividade e repouso de animais com sensor de movimento.">
  <title>SIMUT</title>
  <link rel="icon" href="img/simut.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/simut.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css?v=10">
  <link rel="stylesheet" href="css/base.css?v=10">
  <link rel="stylesheet" href="css/components.css?v=10">
  <link rel="stylesheet" href="css/layout.css?v=10">
  <link rel="stylesheet" href="css/pages.css?v=10">
</head>
<body data-layout="plain">
  <a class="skip-link" id="skipLink" href="#view">Pular para o conteúdo</a>
  <div class="shell">
    <header class="topbar" id="topbar"></header>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="nav-backdrop" id="navBackdrop" hidden></div>
    <div class="main-wrap">
      <p class="err-banner" id="errBanner" role="alert" hidden></p>
      <main class="view" id="view" tabindex="-1">
        <p class="boot muted">Carregando seus dados...</p>
      </main>
    </div>
    <nav class="bottombar" id="bottombar" aria-label="Seções"></nav>
  </div>
  <div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>
  <noscript><p class="boot">O SIMUT precisa de JavaScript ligado.</p></noscript>
  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
